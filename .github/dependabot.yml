version: 2
updates:
- package-ecosystem: "julia"
  directories:
    - "/"
    - "/docs"
    - "/test"
  schedule:
    interval: "weekly"
  groups:
    all-julia-packages:
      patterns:
        - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: "pre-commit"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    all-pre-commit-hooks:
      patterns:
        - "*"
