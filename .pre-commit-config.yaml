repos:
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        name: "check spelling errors"
        description: "Check for spelling errors in files"
        args: []
        pass_filenames: false
  - repo: https://github.com/JuliaEditorSupport/JuliaFormatter.jl
    rev: v2.14.12
    hooks:
    - id: "julia-formatter"
